[build]
  publish = "."
  command = ""

[[redirects]]
  from = "http://namhtofoods.com/*"
  to = "https://namhtofoods.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.namhtofoods.com/*"
  to = "https://namhtofoods.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.namhtofoods.com/*"
  to = "https://namhtofoods.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://*.netlify.app/*"
  to = "https://namhtofoods.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
